<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Animated production AI system loop: retrieve, reason, verify, deploy">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flow" d="M250 124 H950"/>
  </defs>

  <rect x="1" y="1" width="1198" height="248" rx="14" fill="url(#panel)" stroke="#263244"/>
  <path d="M22 22h38M22 22v38M1178 22h-38M1178 22v38M22 228h38M22 228v-38M1178 228h-38M1178 228v-38" fill="none" stroke="#22d3ee" stroke-opacity=".55"/>
  <text x="44" y="49" fill="#64748b" font-family="monospace" font-size="12" letter-spacing="2">PRODUCTION_AI_PIPELINE // LIVE</text>
  <circle cx="1143" cy="43" r="5" fill="#34d399" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1128" y="47" fill="#34d399" font-family="monospace" font-size="11" text-anchor="end">ONLINE</text>

  <line x1="250" y1="124" x2="950" y2="124" stroke="#334155" stroke-width="2"/>
  <circle r="6" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
  </circle>
  <circle r="5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="4.2s" begin="-2.1s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
  </circle>

  <g font-family="monospace">
    <g transform="translate(70 82)">
      <rect width="220" height="84" rx="9" fill="#0b1220" stroke="#22d3ee"/>
      <text x="18" y="28" font-size="11" fill="#22d3ee">01 // RETRIEVE</text>
      <text x="18" y="55" font-size="15" font-weight="700" fill="#e2e8f0">Grounded context</text>
      <rect x="18" y="67" width="126" height="3" fill="#22d3ee" opacity=".65"/>
    </g>
    <g transform="translate(350 82)">
      <rect width="220" height="84" rx="9" fill="#0b1220" stroke="#64748b"/>
      <text x="18" y="28" font-size="11" fill="#a78bfa">02 // REASON</text>
      <text x="18" y="55" font-size="15" font-weight="700" fill="#e2e8f0">Agent workflow</text>
      <rect x="18" y="67" width="112" height="3" fill="#a78bfa" opacity=".65"/>
    </g>
    <g transform="translate(630 82)">
      <rect width="220" height="84" rx="9" fill="#0b1220" stroke="#64748b"/>
      <text x="18" y="28" font-size="11" fill="#22d3ee">03 // VERIFY</text>
      <text x="18" y="55" font-size="15" font-weight="700" fill="#e2e8f0">Evaluate + guard</text>
      <rect x="18" y="67" width="142" height="3" fill="#22d3ee" opacity=".65"/>
    </g>
    <g transform="translate(910 82)">
      <rect width="220" height="84" rx="9" fill="#0b1220" stroke="#a78bfa"/>
      <text x="18" y="28" font-size="11" fill="#a78bfa">04 // DEPLOY</text>
      <text x="18" y="55" font-size="15" font-weight="700" fill="#e2e8f0">Observe + improve</text>
      <rect x="18" y="67" width="152" height="3" fill="#a78bfa" opacity=".65"/>
    </g>
  </g>

  <text x="600" y="213" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="1.5">RELIABILITY IS A SYSTEM PROPERTY — NOT A PROMPT</text>
</svg>
