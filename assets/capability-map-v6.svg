<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="How Vijwal builds AI: ground, control, and ship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1015"/><stop offset="1" stop-color="#121720"/></linearGradient>
    <path id="flow1" d="M330 128 C380 75 420 75 470 128"/>
    <path id="flow2" d="M730 128 C780 181 820 181 870 128"/>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="228" rx="14" fill="url(#bg)" stroke="#2a323d"/>
  <text x="38" y="42" fill="#7f8995" font-family="monospace" font-size="12" letter-spacing="2">HOW I BUILD / THREE SYSTEM LAYERS</text>
  <line x1="330" y1="128" x2="470" y2="128" stroke="#34404c" stroke-dasharray="4 7"/>
  <line x1="730" y1="128" x2="870" y2="128" stroke="#34404c" stroke-dasharray="4 7"/>
  <g font-family="monospace">
    <g transform="translate(38 68)">
      <rect width="292" height="120" rx="10" fill="#10161d" stroke="#2a9d8f"/>
      <text x="22" y="31" fill="#58b7ab" font-size="11" letter-spacing="1.4">01 / GROUND</text>
      <text x="22" y="63" fill="#edf0f2" font-size="19" font-weight="700">RAG + RETRIEVAL</text>
      <text x="22" y="91" fill="#8e98a4" font-size="12">evidence · ranking · memory</text>
      <circle cx="262" cy="27" r="5" fill="#2a9d8f"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(454 68)">
      <rect width="292" height="120" rx="10" fill="#10161d" stroke="#7c6fa8"/>
      <text x="22" y="31" fill="#a095c3" font-size="11" letter-spacing="1.4">02 / CONTROL</text>
      <text x="22" y="63" fill="#edf0f2" font-size="19" font-weight="700">AGENTS + EVALS</text>
      <text x="22" y="91" fill="#8e98a4" font-size="12">routing · guardrails · review</text>
      <circle cx="262" cy="27" r="5" fill="#7c6fa8"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(870 68)">
      <rect width="292" height="120" rx="10" fill="#10161d" stroke="#b98545"/>
      <text x="22" y="31" fill="#d2a568" font-size="11" letter-spacing="1.4">03 / SHIP</text>
      <text x="22" y="63" fill="#edf0f2" font-size="19" font-weight="700">APIs + OPTIMIZATION</text>
      <text x="22" y="91" fill="#8e98a4" font-size="12">latency · caching · deployment</text>
      <circle cx="262" cy="27" r="5" fill="#b98545"><animate attributeName="opacity" values="1;.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>
    <circle r="4" fill="#58b7ab" filter="url(#glow)"><animateMotion dur="3.3s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion></circle>
    <circle r="4" fill="#d2a568" filter="url(#glow)"><animateMotion dur="3.7s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion></circle>
  </g>
</svg>
